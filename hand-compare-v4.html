<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수어이음 손 인식 비교시험</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172338;margin:0;padding:18px}main{max-width:850px;margin:auto}h1{font-size:1.5rem}button,select{padding:10px;font-size:1rem;margin:4px;border-radius:8px}video,canvas{width:100%;border-radius:12px}#view{position:relative;background:#111}canvas{position:absolute;inset:0;height:100%}video{display:block;transform:scaleX(-1)}#status{font-weight:bold}pre{white-space:pre-wrap;background:white;padding:12px;border-radius:8px}small{color:#555}</style></head><body><main><h1>수어이음 · 손 인식 비교시험 V4 (공식 모듈 방식)</h1><p>기존 시험판과 분리된 실험입니다. 손을 벌리기 → 합장 → 다시 벌리기를 각 3초 정도 시험하세요.</p><label>인식 방식 <select id="mode"><option value="old">MediaPipe Hands 0.4 (기존)</option><option value="new">MediaPipe Hand Landmarker (신규)</option></select></label><button id="start">카메라 시작</button><button id="stop" disabled>중지</button><button id="download" disabled>결과 JSON 저장</button><p id="status">대기 중</p><div id="view"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></div><pre id="stats">아직 측정하지 않았습니다.</pre><small>카메라 영상은 업로드하지 않습니다. 모델 파일은 인터넷에서 불러옵니다. 결과에는 손 인식 개수와 시간만 기록하며 영상은 저장하지 않습니다. 합장 중 손이 가려지면 어떤 모델도 양손을 모두 찾지 못할 수 있습니다.</small></main>
<script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');let stream=null,detector=null,raf=0,running=false,frames=[],busy=false,last=0,mode='old';const connections=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function draw(hands){canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;ctx.clearRect(0,0,canvas.width,canvas.height);hands.forEach((h,i)=>{const color=i===0?'#31c5ff':'#ffa34d';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;for(const [a,b] of connections){ctx.beginPath();ctx.moveTo((1-h[a].x)*canvas.width,h[a].y*canvas.height);ctx.lineTo((1-h[b].x)*canvas.width,h[b].y*canvas.height);ctx.stroke()}for(const p of h){ctx.beginPath();ctx.arc((1-p.x)*canvas.width,p.y*canvas.height,4,0,Math.PI*2);ctx.fill()}})}
function update(count){frames.push({elapsed_ms:Math.round(performance.now()-last),detected_hand_count:count});const both=frames.filter(x=>x.detected_hand_count===2).length,one=frames.filter(x=>x.detected_hand_count===1).length,none=frames.length-both-one;$('status').textContent=count===2?'양손 인식 중':count===1?'한 손만 인식 중':'손 인식 안 됨';$('stats').textContent=`방식: ${mode==='old'?'MediaPipe Hands 0.4':'MediaPipe Hand Landmarker'}\n전체 프레임: ${frames.length}\n양손: ${both} (${(100*both/frames.length).toFixed(1)}%)\n한 손: ${one}\n미인식: ${none}`}
async function setupOld(){await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js');const h=new window.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});h.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.5});h.onResults(r=>{if(!running)return;const hands=r.multiHandLandmarks||[];draw(hands);update(hands.length)});return {detect:()=>h.send({image:video}),close:()=>h.close()}}
async function setupNew(){
  const {FilesetResolver,HandLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs');
  const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm');
  const h=await HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
  return {detect:()=>{const r=h.detectForVideo(video,performance.now());const hands=r.landmarks||[];draw(hands);update(hands.length)},close:()=>h.close()}
}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('라이브러리 로딩 실패'));document.head.appendChild(s)})}
async function tick(){if(!running)return;if(!busy&&video.readyState>=2){busy=true;try{await detector.detect()}catch(e){$('status').textContent='인식 오류: '+e.message;await stop()}finally{busy=false}}if(running)raf=requestAnimationFrame(tick)}
async function stop(){running=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(detector){try{await detector.close()}catch{}detector=null}ctx.clearRect(0,0,canvas.width,canvas.height);$('start').disabled=false;$('stop').disabled=true;$('mode').disabled=false;$('download').disabled=!frames.length;if(frames.length)$('status').textContent='측정 종료 · 결과 저장 가능'}
$('start').onclick=async()=>{mode=$('mode').value;$('start').disabled=true;$('mode').disabled=true;$('status').textContent='모델 준비 중...';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();detector=mode==='old'?await setupOld():await setupNew();frames=[];last=performance.now();running=true;$('stop').disabled=false;$('download').disabled=true;tick()}catch(e){await stop();$('status').textContent='시작 실패: '+e.message}};
$('stop').onclick=stop;$('download').onclick=()=>{const data={experiment:'sueoieum-hand-tracker-comparison',model:mode==='old'?'MediaPipe Hands 0.4':'MediaPipe Hand Landmarker tasks-vision CDN latest',created_at:new Date().toISOString(),summary:{frames:frames.length,both_hands:frames.filter(f=>f.detected_hand_count===2).length,one_hand:frames.filter(f=>f.detected_hand_count===1).length,no_hands:frames.filter(f=>f.detected_hand_count===0).length},frames};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`sueoieum-${mode}-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
