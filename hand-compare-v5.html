<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수어이음 손 인식 비교시험</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172338;margin:0;padding:18px}main{max-width:850px;margin:auto}h1{font-size:1.5rem}button,select{padding:10px;font-size:1rem;margin:4px;border-radius:8px}video,canvas{width:100%;border-radius:12px}#view{position:relative;background:#111}canvas{position:absolute;inset:0;height:100%}video{display:block;transform:scaleX(-1)}#status{font-weight:bold}pre{white-space:pre-wrap;background:white;padding:12px;border-radius:8px}small{color:#555}</style></head><body><main><h1>수어이음 · 손 인식 비교시험 V5 (속도 진단판)</h1><p>기존 시험판과 분리된 실험입니다. 손을 벌리기 → 합장 → 다시 벌리기를 각 3초 정도 시험하세요.</p><label>인식 방식 <select id="mode"><option value="old">MediaPipe Hands 0.4 (기존)</option><option value="new">MediaPipe Hand Landmarker (신규)</option></select></label><button id="start">카메라 시작</button><button id="stop" disabled>중지</button><button id="download" disabled>결과 JSON 저장</button><p><label>진단 동작 <select id="action"><option value="separated">양손 벌림</option><option value="palms">합장</option><option value="fast">빠른 좌우 움직임</option></select></label></p><p id="status">대기 중</p><div id="view"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></div><pre id="stats">아직 측정하지 않았습니다.</pre><small>카메라 영상은 업로드하지 않습니다. 모델 파일은 인터넷에서 불러옵니다. 진단값은 실제 카메라 FPS가 아닌 인식 결과 갱신 횟수입니다. 결과에는 손 인식 개수와 시간만 기록하며 영상은 저장하지 않습니다. 합장 중 손이 가려지면 어떤 모델도 양손을 모두 찾지 못할 수 있습니다.</small></main>
<script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');let stream=null,detector=null,raf=0,running=false,frames=[],busy=false,last=0,mode='old',previousResultAt=0,attempts=0,rendered=0,skipped=0,loopError=0,processingTimes=[],lastVideoTime=-1,oldStart=0;const connections=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function draw(hands){canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;ctx.clearRect(0,0,canvas.width,canvas.height);hands.forEach((h,i)=>{const color=i===0?'#31c5ff':'#ffa34d';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;for(const [a,b] of connections){ctx.beginPath();ctx.moveTo((1-h[a].x)*canvas.width,h[a].y*canvas.height);ctx.lineTo((1-h[b].x)*canvas.width,h[b].y*canvas.height);ctx.stroke()}for(const p of h){ctx.beginPath();ctx.arc((1-p.x)*canvas.width,p.y*canvas.height,4,0,Math.PI*2);ctx.fill()}})}
function update(count, processingMs){
 const now=performance.now(),elapsed=now-last,interval=previousResultAt?now-previousResultAt:null;previousResultAt=now;rendered++;
 if(Number.isFinite(processingMs))processingTimes.push(processingMs);
 frames.push({elapsed_ms:Math.round(elapsed),detected_hand_count:count,processing_ms:Number.isFinite(processingMs)?Math.round(processingMs*10)/10:null,result_interval_ms:interval?Math.round(interval*10)/10:null,action:$('action').value});
 const both=frames.filter(x=>x.detected_hand_count===2).length,one=frames.filter(x=>x.detected_hand_count===1).length,none=frames.length-both-one;
 const fps=elapsed>0?(rendered*1000/elapsed):0, avg=processingTimes.length?processingTimes.reduce((a,b)=>a+b,0)/processingTimes.length:0;
 const sorted=[...processingTimes].sort((a,b)=>a-b),p95=sorted.length?sorted[Math.min(sorted.length-1,Math.ceil(sorted.length*.95)-1)]:0;
 $('status').textContent=count===2?'양손 인식 중':count===1?'한 손만 인식 중':'손 인식 안 됨';
 $('stats').textContent=`방식: ${mode==='old'?'MediaPipe Hands 0.4':'MediaPipe Hand Landmarker'}\n진단 동작: ${$('action').selectedOptions[0].text}\n결과 갱신 속도: ${fps.toFixed(1)}회/초 (평균)\n인식 처리 시간: ${avg.toFixed(1)}ms (평균) / ${p95.toFixed(1)}ms (95백분위)\n결과 간 간격: ${interval?interval.toFixed(0)+'ms':'측정 중'}\n양손: ${both}/${frames.length} (${(100*both/frames.length).toFixed(1)}%)\n한 손: ${one} / 미인식: ${none}\n카메라 프레임 변화 없이 건너뜀: ${skipped}`;
}
async function setupOld(){await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js');const h=new window.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});h.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.5});h.onResults(r=>{if(!running)return;const hands=r.multiHandLandmarks||[];draw(hands);update(hands.length,performance.now()-oldStart)});return {detect:()=>{oldStart=performance.now();return h.send({image:video})},close:()=>h.close()}}
async function setupNew(){
  const {FilesetResolver,HandLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs');
  const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm');
  const h=await HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
  return {detect:()=>{const start=performance.now();const r=h.detectForVideo(video,start);const processing=performance.now()-start;const hands=r.landmarks||[];draw(hands);update(hands.length,processing)},close:()=>h.close()}
}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('라이브러리 로딩 실패'));document.head.appendChild(s)})}
async function tick(){if(!running)return;if(!busy&&video.readyState>=2){if(video.currentTime===lastVideoTime){skipped++;raf=requestAnimationFrame(tick);return}lastVideoTime=video.currentTime;busy=true;attempts++;try{await detector.detect()}catch(e){$('status').textContent='인식 오류: '+e.message;await stop()}finally{busy=false}}if(running)raf=requestAnimationFrame(tick)}
async function stop(){running=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(detector){try{await detector.close()}catch{}detector=null}ctx.clearRect(0,0,canvas.width,canvas.height);$('start').disabled=false;$('stop').disabled=true;$('mode').disabled=false;$('download').disabled=!frames.length;if(frames.length)$('status').textContent='측정 종료 · 결과 저장 가능'}
$('start').onclick=async()=>{mode=$('mode').value;$('start').disabled=true;$('mode').disabled=true;$('status').textContent='모델 준비 중...';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();detector=mode==='old'?await setupOld():await setupNew();frames=[];processingTimes=[];attempts=0;rendered=0;skipped=0;previousResultAt=0;lastVideoTime=-1;last=performance.now();running=true;$('stop').disabled=false;$('download').disabled=true;tick()}catch(e){await stop();$('status').textContent='시작 실패: '+e.message}};
$('stop').onclick=stop;$('download').onclick=()=>{const data={experiment:'sueoieum-hand-tracker-comparison',model:mode==='old'?'MediaPipe Hands 0.4':'MediaPipe Hand Landmarker tasks-vision CDN latest',created_at:new Date().toISOString(),diagnostics:{attempts,results:rendered,skipped_unchanged_video_frames:skipped,average_processing_ms:processingTimes.length?processingTimes.reduce((a,b)=>a+b,0)/processingTimes.length:null,average_result_fps:frames.length&&frames[frames.length-1].elapsed_ms?frames.length*1000/frames[frames.length-1].elapsed_ms:null,notes:'Results are not raw camera FPS; visual stutter may come from processing, camera, or rendering. A count of 2 does not guarantee accurate landmarks.'},summary:{frames:frames.length,both_hands:frames.filter(f=>f.detected_hand_count===2).length,one_hand:frames.filter(f=>f.detected_hand_count===1).length,no_hands:frames.filter(f=>f.detected_hand_count===0).length},frames};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`sueoieum-${mode}-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
